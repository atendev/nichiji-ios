# PROTOTYPE, throwaway. ML Kit Digital Ink harness for the handwriting recognizer ticket.
name: MLKitHarness
options:
  bundleIdPrefix: com.aten.nichiji.prototype
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MLKitHarness:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ML Kit Harness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  MLKitHarness:
    build:
      targets:
        MLKitHarness: all
