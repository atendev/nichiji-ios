<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flashcards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent;transition:background-color .18s ease,border-color .18s ease,transform .12s ease,opacity .18s ease}
button:focus-visible{outline:2px solid #2f4a6b;outline-offset:2px}
button:active{transform:scale(.97)}
.cta:hover{background:#9c2915 !important}
.ghost:hover{background:#eae2d1 !important}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes segfill{from{background-size:0% 100%,auto}to{background-size:100% 100%,auto}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes cardInA{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes cardInB{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.screen{animation:enter .32s ease-out both}
.seg-now{background:linear-gradient(#1f1b16,#1f1b16) left/100% 100% no-repeat,#d9cfbc;animation:segfill .45s .1s ease-out both}
.pop{animation:pop .2s ease-out both}
.card-in-a{animation:cardInA .38s ease-out both}
.card-in-b{animation:cardInB .38s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="screen" style="overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 48px; display: flex; flex-direction: column; background: #f4eee2; color: #1f1b16; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<button class="ghost" onClick="{{ back }}" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; border: 0; border-radius: 8px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div role="img" aria-label="Step 2 of 6" style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
<div style="height: 4px; border-radius: 999px; background: #1f1b16"></div>
<div class="seg-now" style="height: 4px; border-radius: 999px"></div>
<div style="height: 4px; border-radius: 999px; background: #d9cfbc"></div>
<div style="height: 4px; border-radius: 999px; background: #d9cfbc"></div>
<div style="height: 4px; border-radius: 999px; background: #d9cfbc"></div>
<div style="height: 4px; border-radius: 999px; background: #d9cfbc"></div>
</div>
<button class="ghost" onClick="{{ skip }}" style="min-width: 44px; height: 44px; margin-right: -8px; border: 0; border-radius: 8px; background: transparent; padding: 0 8px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #5e5548; cursor: pointer">Skip</button>
</div>
<div style="margin-top: 24px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 500">Review with flashcards</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; font-weight: 400; color: #5e5548">Kanji you have learned become flashcards. Tap a card to see the answer, then mark whether you knew it.</p>
</div>
<div style="position: relative; margin-top: 32px; height: 236px">
<div class="{{ wrapClass }}" style="{{ wrapStyle }}">
<button onClick="{{ flip }}" aria-label="Flashcard. Tap to flip." style="{{ flipStyle }}">
<span style="{{ frontStyle }}">
<span lang="ja" style="font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 64px; line-height: 1.1; font-weight: 500">{{ card.kanji }}</span>
<span style="margin-top: 16px; font-size: 12px; line-height: 16px; color: #74695a">Tap to see the answer</span>
</span>
<span style="{{ backStyle }}">
<span lang="ja" style="font-size: 16px; line-height: 24px; color: #5e5548">{{ card.readings }}</span>
<span style="font-size: 20px; line-height: 26px; font-weight: 500; color: #1f1b16">{{ card.meaning }}</span>
<span style="margin-top: 16px; display: flex; align-items: baseline; gap: 8px">
<span lang="ja" style="font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 18px; line-height: 24px">{{ card.word }}</span>
<span lang="ja" style="font-size: 12px; line-height: 16px; color: #5e5548">{{ card.wordReading }}</span>
<span style="font-size: 14px; line-height: 20px; color: #5e5548">{{ card.wordMeaning }}</span>
</span>
</span>
</button>
<div aria-hidden="true" style="{{ goodBadgeStyle }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3f6b3a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span>Got it</span>
</div>
<div aria-hidden="true" style="{{ forgotBadgeStyle }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a67300" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"></path><path d="M3.5 4.5v5h5"></path></svg>
<span>Forgot it</span>
</div>
</div>
</div>
<div style="margin-top: 12px; text-align: center; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; color: #74695a">{{ counter }}</div>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button onClick="{{ forgot }}" style="{{ forgotBtnStyle }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a67300" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"></path><path d="M3.5 4.5v5h5"></path></svg>
<span>Forgot it</span>
</button>
<button onClick="{{ know }}" style="{{ gotBtnStyle }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3f6b3a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span>Got it</span>
</button>
</div>
<div style="flex: 1"></div>
<button class="cta" onClick="{{ next }}" style="width: 100%; min-height: 52px; border: 0; border-radius: 8px; background: #b8321d; color: #ffffff; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer">Continue</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onNext":{"editor":null},"onBack":{"editor":null},"onSkip":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, flipped: false, exit: null, alt: false, entered: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  swipe(dir) {
    if (this.state.exit) return;
    this.setState({ exit: dir });
    this.timer = setTimeout(() => {
      this.setState((s) => ({ i: (s.i + 1) % 3, flipped: false, exit: null, alt: !s.alt, entered: true }));
    }, 420);
  }
  renderVals() {
    const cards = [
      { kanji: '学', readings: 'ガク · まな-ぶ', meaning: 'study, learning', word: '学校', wordReading: 'がっこう', wordMeaning: 'school' },
      { kanji: '字', readings: 'ジ · あざ', meaning: 'character, letter', word: '文字', wordReading: 'もじ', wordMeaning: 'letter' },
      { kanji: '日', readings: 'ニチ · ジツ · ひ', meaning: 'day, sun', word: '日本', wordReading: 'にほん', wordMeaning: 'Japan' }
    ];
    const st = this.state || {};
    const i = st.i || 0;
    const flipped = !!st.flipped;
    const exit = st.exit || null;

    const wrapBase = 'position: absolute; inset: 0; perspective: 1000px; ';
    let wrapStyle = wrapBase + 'transform: none; opacity: 1;';
    if (exit === 'right') wrapStyle = wrapBase + 'transform: translateX(400px) rotate(16deg); opacity: 0; transition: transform 0.42s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.42s ease-in;';
    if (exit === 'left') wrapStyle = wrapBase + 'transform: translateX(-400px) rotate(-16deg); opacity: 0; transition: transform 0.42s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.42s ease-in;';
    const wrapClass = st.entered && !exit ? (st.alt ? 'card-in-a' : 'card-in-b') : '';

    const border = exit === 'right' ? '#3f6b3a' : (exit === 'left' ? '#a67300' : '#8c8068');
    const face = 'position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #fbf7ee; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: border-color 0.2s ease; border: 1px solid ' + border + ';';

    const badge = (on, bg, bd, fg) => 'position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: ' + bg + '; border: 1px solid ' + bd + '; color: ' + fg + '; font-size: 14px; line-height: 20px; font-weight: 500; pointer-events: none; transition: opacity 0.2s ease, transform 0.3s ease; opacity: ' + (on ? 1 : 0) + '; transform: translate(-50%, -50%) scale(' + (on ? 1 : 0.7) + ');';

    const btn = (on, bg, bd) => 'box-sizing: border-box; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16; cursor: pointer; ' + (on ? 'background: ' + bg + '; border: 1px solid ' + bd + ';' : 'background: transparent; border: 1px solid #8c8068;');

    return {
      card: cards[i],
      counter: (i + 1) + ' OF ' + cards.length,
      wrapClass: wrapClass,
      wrapStyle: wrapStyle,
      flipStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; font-family: inherit; color: #1f1b16; cursor: pointer; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.3, 0.1, 0.2, 1); transform: rotateY(' + (flipped ? 180 : 0) + 'deg);',
      frontStyle: face,
      backStyle: face + ' transform: rotateY(180deg);',
      goodBadgeStyle: badge(exit === 'right', '#dce5d0', '#3f6b3a', '#3f6b3a'),
      forgotBadgeStyle: badge(exit === 'left', '#f6e8bd', '#a67300', '#6b4a00'),
      forgotBtnStyle: btn(exit === 'left', '#f6e8bd', '#a67300'),
      gotBtnStyle: btn(exit === 'right', '#dce5d0', '#3f6b3a'),
      flip: () => { if (!this.state.exit) this.setState({ flipped: !this.state.flipped }); },
      know: () => this.swipe('right'),
      forgot: () => this.swipe('left'),
      next: () => { if (this.props.onNext) this.props.onNext(); },
      back: () => { if (this.props.onBack) this.props.onBack(); },
      skip: () => { if (this.props.onSkip) this.props.onSkip(); }
    };
  }
}
</script>
</body>
</html>
