<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: Level</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s ease,opacity .18s ease}
button:focus-visible{outline:2px solid #2f4a6b;outline-offset:2px}
button:active{transform:scale(.97)}
.ghost:hover{background:#eae2d1 !important}
.row:hover{background:#eae2d1 !important}
.row:active{transform:none}
.scroll{scrollbar-width:none;-ms-overflow-style:none}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.push-in{animation:pushIn .3s cubic-bezier(.2,.8,.2,1) both}
.push-out{animation:pushOut .24s ease-in both}
.pop{animation:pop .2s ease-out both}
.fade{animation:fadeIn .2s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="{{ rootClass }}" style="overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 0; display: flex; flex-direction: column; background: #f4eee2; color: #1f1b16; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif">
<div style="display: flex; align-items: center; height: 44px; padding: 0 24px; flex: none">
<button class="ghost" onClick="{{ back }}" aria-label="Back to settings" style="height: 44px; margin-left: -12px; padding: 0 12px 0 8px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 2px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>Settings</span>
</button>
</div>
<div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 24px 48px">
<div style="margin-top: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 500">Level</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; font-weight: 400; color: #5e5548">Your daily kanji match your level.</p>
</div>

<div style="margin: 24px 8px 8px; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; color: #74695a">LEVELS BASED ON</div>
<div role="tablist" aria-label="Level system" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #eae2d1; border-radius: 12px">
<button role="tab" aria-selected="{{ isJlpt }}" onClick="{{ pickJlpt }}" style="{{ jlptTab }}">JLPT</button>
<button role="tab" aria-selected="{{ isJoyo }}" onClick="{{ pickJoyo }}" style="{{ joyoTab }}">Jōyō grade</button>
</div>
<p style="margin: 8px 8px 0; font-size: 12px; line-height: 16px; color: #74695a">{{ schemeNote }}</p>

<div class="fade" style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ levels }}" as="item" hint-placeholder-count="5">
<button onClick="{{ item.pick }}" aria-pressed="{{ item.selected }}" style="{{ item.rowStyle }}">
<span style="width: 36px; text-align: left; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.02em; color: #1f1b16">{{ item.code }}</span>
<span style="flex: 1; text-align: left; font-size: 16px; line-height: 24px; font-weight: 400; color: #1f1b16">{{ item.name }}</span>
<span style="font-size: 12px; line-height: 16px; color: #5e5548">{{ item.count }}</span>
<span style="width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ item.selected }}" hint-placeholder-val="{{ false }}">
<svg class="pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b8321d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Selected"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
</button>
</sc-for>
</div>

<div style="margin: 24px 8px 8px; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; color: #74695a">DAILY ORDER</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ orders }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" aria-pressed="{{ o.selected }}" style="{{ o.rowStyle }}">
<span style="flex: 1; text-align: left">
<span style="display: block; font-size: 16px; line-height: 24px; color: #1f1b16">{{ o.name }}</span>
<span style="display: block; font-size: 12px; line-height: 16px; color: #5e5548">{{ o.note }}</span>
</span>
<sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}">
<svg class="pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b8321d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Selected"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</button>
</sc-for>
</div>

<div style="margin: 24px 8px 8px; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.06em; color: #74695a">CUSTOM</div>
<button class="row" onClick="{{ customize }}" aria-pressed="{{ customActive }}" style="{{ customStyle }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
<span style="flex: 1">
<span style="display: block; font-size: 16px; line-height: 24px; color: #1f1b16">Customize your kanji</span>
<span style="display: block; font-size: 12px; line-height: 16px; color: #5e5548">{{ customNote }}</span>
</span>
<sc-if value="{{ customActive }}" hint-placeholder-val="{{ false }}">
<svg class="pop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b8321d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Selected"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{ customInactive }}" hint-placeholder-val="{{ true }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#74695a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</sc-if>
</button>
<p style="margin: 16px 8px 0; font-size: 12px; line-height: 16px; font-weight: 400; color: #74695a">You can change this any time. Kanji you have learned stay learned.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"customActive":{"editor":null},"customCount":{"editor":null},"onCustomize":{"editor":null},"level":{"editor":null},"order":{"editor":null},"onOrder":{"editor":null},"onLevel":{"editor":null},"onBack":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const lv = (props && props.level) || 'N5';
    this.state = { level: lv, scheme: lv.charAt(0) === 'G' ? 'joyo' : 'jlpt', order: (props && props.order) || 'common', leaving: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  renderVals() {
    const st = this.state || {};
    const current = st.level || 'N5';
    const scheme = st.scheme || 'jlpt';
    const order = st.order || 'common';
    const customActive = (this.props.customActive !== undefined && this.props.customActive !== null) ? !!this.props.customActive : !!st.customLocal;
    const jlpt = [
      { code: 'N5', name: 'Beginner', count: '' },
      { code: 'N4', name: 'Elementary', count: '' },
      { code: 'N3', name: 'Intermediate', count: '' },
      { code: 'N2', name: 'Upper intermediate', count: '' },
      { code: 'N1', name: 'Advanced', count: '' }
    ];
    // Jōyō kanji counts follow the 2020 grade lists.
    const joyo = [
      { code: 'G1', name: '1st grade', count: '80 kanji' },
      { code: 'G2', name: '2nd grade', count: '160 kanji' },
      { code: 'G3', name: '3rd grade', count: '200 kanji' },
      { code: 'G4', name: '4th grade', count: '202 kanji' },
      { code: 'G5', name: '5th grade', count: '193 kanji' },
      { code: 'G6', name: '6th grade', count: '191 kanji' },
      { code: 'GS', name: 'Secondary school', count: '1,110 kanji' }
    ];
    const box = (on) => 'box-sizing: border-box; width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 8px; font-family: inherit; cursor: pointer; ' +
      (on ? 'background: #f7e6de; border: 1px solid #b8321d;' : 'background: #fbf7ee; border: 1px solid #8c8068;');
    const levels = (scheme === 'joyo' ? joyo : jlpt).map((l) => {
      const selected = !customActive && l.code === current;
      return {
        code: scheme === 'joyo' ? (l.code === 'GS' ? 'S' : l.code.charAt(1)) : l.code,
        name: l.name,
        count: l.count,
        selected: selected,
        pick: () => {
          this.setState({ level: l.code, customLocal: false });
          if (this.props.onLevel) this.props.onLevel(l.code);
        },
        rowStyle: box(selected)
      };
    });
    const orderDefs = [
      { key: 'common', name: 'Most common', note: 'Everyday kanji come first.' },
      { key: 'list', name: 'List order', note: 'Follows the order of the level list.' },
      { key: 'random', name: 'Random', note: 'A different kanji each day.' }
    ];
    const orders = orderDefs.map((o) => {
      const selected = o.key === order;
      return {
        name: o.name, note: o.note, selected: selected,
        rowStyle: box(selected) + ' min-height: 64px;',
        pick: () => {
          this.setState({ order: o.key });
          if (this.props.onOrder) this.props.onOrder(o.key);
        }
      };
    });
    const seg = (on) => 'min-height: 40px; border: 0; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 20px; cursor: pointer; ' +
      (on ? 'background: #fbf7ee; color: #1f1b16; font-weight: 500; box-shadow: 0 0 0 1px #8c8068;' : 'background: transparent; color: #5e5548; font-weight: 400;');
    const setScheme = (s) => {
      if (s === scheme) return;
      const next = s === 'joyo' ? 'G1' : 'N5';
      this.setState({ scheme: s, level: next, customLocal: false });
      if (this.props.onLevel) this.props.onLevel(next);
    };
    const leaving = !!st.leaving;
    return {
      levels: levels,
      orders: orders,
      isJlpt: scheme === 'jlpt', isJoyo: scheme === 'joyo',
      jlptTab: seg(scheme === 'jlpt'), joyoTab: seg(scheme === 'joyo'),
      pickJlpt: () => setScheme('jlpt'), pickJoyo: () => setScheme('joyo'),
      schemeNote: scheme === 'joyo' ? 'Jōyō grades follow the Japanese school curriculum, from 1st grade to secondary school.' : 'JLPT levels follow the Japanese-Language Proficiency Test, from N5 to N1.',
      customActive: customActive,
      customInactive: !customActive,
      customStyle: box(customActive) + ' min-height: 64px; text-align: left;',
      customNote: this.props.customCount ? this.props.customCount + ' kanji on. Choose exactly which to study.' : 'Choose exactly which kanji to study.',
      customize: () => { if (this.props.onCustomize) this.props.onCustomize(); },
      rootClass: this.props.onBack ? (leaving ? 'push-out' : 'push-in') : '',
      back: () => {
        if (!this.props.onBack || this.state.leaving) return;
        this.setState({ leaving: true });
        this.timer = setTimeout(() => this.props.onBack(), 240);
      }
    };
  }
}
</script>
</body>
</html>
