<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: Privacy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s ease,opacity .18s ease}
button:focus-visible{outline:2px solid #2f4a6b;outline-offset:2px}
button:active{transform:scale(.97)}
.ghost:hover{background:#eae2d1 !important}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
.push-in{animation:pushIn .3s cubic-bezier(.2,.8,.2,1) both}
.push-out{animation:pushOut .24s ease-in both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="{{ rootClass }}" style="overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 48px; display: flex; flex-direction: column; background: #f4eee2; color: #1f1b16; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif">
<div style="display: flex; align-items: center; height: 44px">
<button class="ghost" onClick="{{ back }}" aria-label="Back to settings" style="height: 44px; margin-left: -12px; padding: 0 12px 0 8px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 2px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>Settings</span>
</button>
</div>
<div style="margin-top: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 500">Privacy</h1>
</div>
<div style="margin-top: 24px; box-sizing: border-box; padding: 24px; background: #fbf7ee; border: 1px solid #d9cfbc; border-radius: 20px">
<div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 4px; background: #dce5d0; color: #3f6b3a; font-size: 12px; line-height: 16px; font-weight: 500">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3f6b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span>Data not collected</span>
</div>
<h2 style="margin: 16px 0 0; font-size: 20px; line-height: 26px; font-weight: 500">Nichiji collects nothing</h2>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: #5e5548">The app does not collect any data about you. You do not need an account to use it.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onBack":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { leaving: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  renderVals() {
    const leaving = !!(this.state && this.state.leaving);
    return {
      rootClass: leaving ? 'push-out' : 'push-in',
      back: () => {
        if (!this.props.onBack || this.state.leaving) return;
        this.setState({ leaving: true });
        this.timer = setTimeout(() => this.props.onBack(), 240);
      }
    };
  }
}
</script>
</body>
</html>
