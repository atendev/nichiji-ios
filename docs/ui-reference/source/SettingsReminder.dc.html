<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: Daily reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s ease,opacity .18s ease}
button:focus-visible{outline:2px solid #2f4a6b;outline-offset:2px}
button:active{transform:scale(.97)}
.ghost:hover{background:#eae2d1 !important}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.push-in{animation:pushIn .3s cubic-bezier(.2,.8,.2,1) both}
.push-out{animation:pushOut .24s ease-in both}
.pop{animation:pop .2s ease-out both}
.rise{animation:rise .3s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="{{ rootClass }}" style="overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 48px; display: flex; flex-direction: column; background: #f4eee2; color: #1f1b16; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif">
<div style="display: flex; align-items: center; height: 44px">
<button class="ghost" onClick="{{ back }}" aria-label="Back to settings" style="height: 44px; margin-left: -12px; padding: 0 12px 0 8px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 2px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>Settings</span>
</button>
</div>
<div style="margin-top: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 500">Daily reminder</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; font-weight: 400; color: #5e5548">One reminder a day, naming the kanji. Never more than one.</p>
</div>
<div style="margin-top: 24px; box-sizing: border-box; min-height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #fbf7ee; border: 1px solid #d9cfbc; border-radius: 8px">
<span style="flex: 1; font-size: 16px; line-height: 24px; color: #1f1b16">Remind me daily</span>
<button role="switch" aria-checked="{{ on }}" aria-label="Remind me daily" onClick="{{ toggle }}" style="{{ trackStyle }}"><span style="{{ knobStyle }}"></span></button>
</div>
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
<div class="rise">
<div style="margin-top: 24px; box-sizing: border-box; padding: 16px; display: flex; align-items: center; gap: 12px; background: #fbf7ee; border: 1px solid #d9cfbc; border-radius: 20px">
<img src="/_blob/0486ce41d8aaf6f98585de7490c5df7d" alt="" style="width: 40px; height: 40px; display: block; flex: none">
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16">Nichiji</span>
<span style="font-size: 12px; line-height: 16px; color: #74695a">{{ time }}</span>
</div>
<div style="font-size: 16px; line-height: 24px; color: #1f1b16"><span lang="ja" style="font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif">学</span> · Today's kanji is ready</div>
</div>
</div>
<h2 style="margin: 32px 0 0; font-size: 20px; line-height: 26px; font-weight: 500">Time</h2>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ times }}" as="item" hint-placeholder-count="3">
<button onClick="{{ item.pick }}" aria-pressed="{{ item.selected }}" style="{{ item.chipStyle }}">
<sc-if value="{{ item.selected }}" hint-placeholder-val="{{ false }}">
<svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8321d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Selected"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<span>{{ item.label }}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ off }}" hint-placeholder-val="{{ false }}">
<p class="rise" style="margin: 16px 8px 0; font-size: 14px; line-height: 20px; color: #5e5548">No reminder will be sent. You can still open Nichiji any time to see today's kanji.</p>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"on":{"editor":null},"time":{"editor":null},"onToggle":{"editor":null},"onTime":{"editor":null},"onBack":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const p = props || {};
    this.state = { on: p.on === undefined || p.on === null ? true : !!p.on, time: p.time || '8:00 am', leaving: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  renderVals() {
    const st = this.state || {};
    const on = st.on !== false;
    const time = st.time || '8:00 am';
    const times = ['8:00 am', '12:00 pm', '8:00 pm'].map((t) => {
      const selected = t === time;
      return {
        label: t,
        selected: selected,
        pick: () => {
          this.setState({ time: t });
          if (this.props.onTime) this.props.onTime(t);
        },
        chipStyle: 'box-sizing: border-box; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16; cursor: pointer; ' +
          (selected ? 'background: #f7e6de; border: 1px solid #b8321d;' : 'background: #fbf7ee; border: 1px solid #8c8068;')
      };
    });
    const leaving = !!st.leaving;
    return {
      on: on,
      off: !on,
      time: time,
      times: times,
      rootClass: leaving ? 'push-out' : 'push-in',
      trackStyle: 'position: relative; flex: none; width: 51px; height: 31px; padding: 0; border-radius: 999px; cursor: pointer; transition: background-color 0.2s ease, border-color 0.2s ease; ' +
        (on ? 'background: #1f1b16; border: 1px solid #1f1b16;' : 'background: #eae2d1; border: 1px solid #8c8068;'),
      knobStyle: 'position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; transition: transform 0.2s ease, background-color 0.2s ease; transform: translateX(' + (on ? 20 : 0) + 'px); ' +
        (on ? 'background: #f4eee2;' : 'background: #fbf7ee; box-shadow: 0 0 0 1px #8c8068;'),
      toggle: () => {
        this.setState({ on: !on });
        if (this.props.onToggle) this.props.onToggle(!on);
      },
      back: () => {
        if (!this.props.onBack || this.state.leaving) return;
        this.setState({ leaving: true });
        this.timer = setTimeout(() => this.props.onBack(), 240);
      }
    };
  }
}
</script>
</body>
</html>
