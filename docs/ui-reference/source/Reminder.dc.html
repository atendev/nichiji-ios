<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent;transition:background-color .18s ease,border-color .18s ease,transform .12s ease,opacity .18s ease}
button:focus-visible{outline:2px solid #2f4a6b;outline-offset:2px}
button:active{transform:scale(.97)}
.cta:hover{background:#9c2915 !important}
.ghost:hover{background:#eae2d1 !important}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes segfill{from{background-size:0% 100%,auto}to{background-size:100% 100%,auto}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.screen{animation:enter .32s ease-out both}
.seg-now{background:linear-gradient(#1f1b16,#1f1b16) left/100% 100% no-repeat,#d9cfbc;animation:segfill .45s .1s ease-out both}
.pop{animation:pop .2s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="screen" style="overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 48px; display: flex; flex-direction: column; background: #f4eee2; color: #1f1b16; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<button class="ghost" onClick="{{ back }}" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; border: 0; border-radius: 8px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div role="img" aria-label="Step 4 of 6" style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
<div style="height: 4px; border-radius: 999px; background: #1f1b16"></div>
<div style="height: 4px; border-radius: 999px; background: #1f1b16"></div>
<div style="height: 4px; border-radius: 999px; background: #1f1b16"></div>
<div class="seg-now" style="height: 4px; border-radius: 999px"></div>
<div style="height: 4px; border-radius: 999px; background: #d9cfbc"></div>
<div style="height: 4px; border-radius: 999px; background: #d9cfbc"></div>
</div>
<div style="width: 44px; height: 44px; margin-right: -8px"></div>
</div>
<div style="margin-top: 24px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 500">A quiet daily reminder</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; font-weight: 400; color: #5e5548">One reminder a day, naming the kanji. Never more than one.</p>
</div>
<div style="margin-top: 32px; box-sizing: border-box; padding: 16px; display: flex; align-items: center; gap: 12px; background: #fbf7ee; border: 1px solid #d9cfbc; border-radius: 20px">
<img src="/_blob/0486ce41d8aaf6f98585de7490c5df7d" alt="" style="width: 40px; height: 40px; display: block; flex: none">
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16">Nichiji</span>
<span style="font-size: 12px; line-height: 16px; color: #74695a">now</span>
</div>
<div style="font-size: 16px; line-height: 24px; color: #1f1b16"><span lang="ja" style="font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif">学</span> · Today's kanji is ready</div>
</div>
</div>
<h2 style="margin: 32px 0 0; font-size: 20px; line-height: 26px; font-weight: 500">When should it arrive?</h2>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ times }}" as="item" hint-placeholder-count="3">
<button onClick="{{ item.pick }}" aria-pressed="{{ item.selected }}" style="{{ item.chipStyle }}">
<sc-if value="{{ item.selected }}" hint-placeholder-val="{{ false }}">
<svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8321d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Selected"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<span>{{ item.label }}</span>
</button>
</sc-for>
</div>
<p style="margin: 12px 0 0; font-size: 12px; line-height: 16px; font-weight: 400; color: #74695a">You can change the time in Settings.</p>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<button class="cta" onClick="{{ next }}" style="width: 100%; min-height: 52px; border: 0; border-radius: 8px; background: #b8321d; color: #ffffff; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer">Allow reminders</button>
<button class="ghost" onClick="{{ next }}" style="border-radius: 8px; width: 100%; min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #5e5548; cursor: pointer">Not now</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onNext":{"editor":null},"onBack":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { time: '8:00 am' };
  }
  renderVals() {
    const current = (this.state && this.state.time) || '8:00 am';
    const times = ['8:00 am', '12:00 pm', '8:00 pm'].map((t) => {
      const selected = t === current;
      return {
        label: t,
        selected: selected,
        pick: () => this.setState({ time: t }),
        chipStyle: 'box-sizing: border-box; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: #1f1b16; cursor: pointer; ' +
          (selected ? 'background: #f7e6de; border: 1px solid #b8321d;' : 'background: #fbf7ee; border: 1px solid #8c8068;')
      };
    });
    return {
      times: times,
      next: () => { if (this.props.onNext) this.props.onNext(); },
      back: () => { if (this.props.onBack) this.props.onBack(); }
    };
  }
}
</script>
</body>
</html>
