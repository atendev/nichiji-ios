<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customize your kanji, full length</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 2080px; overflow: hidden; background: #f4eee2">
<dc-import name="SettingsCustomKanji" expanded="{{ yes }}" hint-size="390px,2080px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2080}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
