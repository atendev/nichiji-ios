<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera scene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #8faad0;outline-offset:2px}
@keyframes boxIn{from{opacity:0;transform:scale(1.18)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateY(0);opacity:1}92%{opacity:1}100%{transform:translateY(340px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; overflow: hidden; background: #1a1510; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif">
<div aria-hidden="true" style="{{ photoStyle }}">
<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 18% 10%, rgba(255, 214, 150, 0.26), transparent 38%), radial-gradient(circle at 88% 90%, rgba(255, 190, 120, 0.14), transparent 42%), linear-gradient(165deg, #4a3d31 0%, #2d241c 55%, #1a1510 100%)"></div>
<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.018) 0 2px, transparent 2px 9px)"></div>
<div style="{{ boardStyle }}">
<div style="position: absolute; left: 24px; top: 170px; width: 342px; height: 340px; box-sizing: border-box; border-radius: 3px; background: linear-gradient(135deg, #f3ead6, #e4d9bd); box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.35)"></div>
<div style="position: absolute; left: 38px; top: 184px; width: 314px; height: 312px; box-sizing: border-box; border: 2px solid rgba(35, 29, 23, 0.85); border-radius: 2px"></div>
<div style="position: absolute; left: 36px; top: 160px; width: 54px; height: 20px; background: rgba(216, 200, 154, 0.8); transform: rotate(-8deg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25)"></div>
<div style="position: absolute; left: 300px; top: 160px; width: 54px; height: 20px; background: rgba(216, 200, 154, 0.8); transform: rotate(7deg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25)"></div>
<div style="position: absolute; left: 48px; top: 276px; width: 294px; height: 0; border-top: 1.5px solid rgba(35, 29, 23, 0.5)"></div>
<div style="position: absolute; left: 48px; top: 378px; width: 294px; height: 0; border-top: 1.5px solid rgba(35, 29, 23, 0.5)"></div>
<div style="position: absolute; left: 48px; top: 452px; width: 294px; height: 0; border-top: 1.5px solid rgba(35, 29, 23, 0.5)"></div>
<sc-for list="{{ glyphs }}" as="g" hint-placeholder-count="12">
<div lang="ja" style="{{ g.style }}">{{ g.ch }}</div>
</sc-for>
<sc-for list="{{ latin }}" as="t" hint-placeholder-count="4">
<div style="{{ t.style }}">{{ t.text }}</div>
</sc-for>
</div>
</div>
<sc-if value="{{ showBoxes }}" hint-placeholder-val="{{ true }}">
<div style="{{ boardStyle }}">
<sc-if value="{{ scanning }}" hint-placeholder-val="{{ false }}">
<div style="{{ lineStyle }}"></div>
</sc-if>
<sc-for list="{{ boxes }}" as="b" hint-placeholder-count="11">
<button onClick="{{ b.pick }}" aria-label="{{ b.label }}" style="{{ b.style }}"></button>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"boxes":{"editor":"select","options":["none","scan","all"],"default":"none"},"tilt":{"editor":"number","default":-2},"blur":{"editor":"number","default":0},"hide":{"editor":null},"scanAt":{"editor":null},"onPick":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const mode = p.boxes || 'none';
    const hide = !!p.hide && p.hide !== 'false';
    const tilt = p.tilt === undefined || p.tilt === '' ? -2 : Number(p.tilt);
    const blur = p.blur === undefined || p.blur === '' ? 0 : Number(p.blur);
    const hasAt = p.scanAt !== undefined && p.scanAt !== null && p.scanAt !== '';
    const at = hasAt ? Number(p.scanAt) : 0;
    // Kanji printed on the notice, in reading order. Learned ones are the kanji this learner has already marked.
    // Keep this list in step with Camera.dc.html.
    const LEARNED = { '日': 1, '本': 1, '学': 1, '校': 1, '月': 1, '金': 1 };
    const K = [
      ['日', 45, 200, 56], ['本', 105, 200, 56], ['語', 165, 200, 56], ['学', 225, 200, 56], ['校', 285, 200, 56],
      ['入', 52, 298, 44], ['口', 100, 298, 44], ['受', 214, 298, 44], ['付', 262, 298, 44],
      ['月', 52, 396, 34], ['金', 118, 396, 34]
    ];
    const serif = "'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif";
    const glyphs = K.map((k) => ({
      ch: k[0],
      style: 'position: absolute; left: ' + k[1] + 'px; top: ' + k[2] + 'px; width: ' + k[3] + 'px; height: ' + k[3] + 'px; text-align: center; font-family: ' + serif + '; font-weight: 500; color: #231d17; font-size: ' + k[3] + 'px; line-height: ' + k[3] + 'px;'
    }));
    glyphs.push({ ch: '〜', style: 'position: absolute; left: 86px; top: 396px; width: 34px; height: 34px; text-align: center; font-family: ' + serif + '; color: #231d17; font-size: 26px; line-height: 34px;' });
    const cap = 'position: absolute; font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.16em; color: #5a5043; white-space: nowrap;';
    const latin = [
      { text: 'ENTRANCE', style: cap + ' left: 52px; top: 350px;' },
      { text: 'RECEPTION', style: cap + ' left: 214px; top: 350px;' },
      { text: '9:00 – 17:00', style: 'position: absolute; left: 176px; top: 403px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.06em; color: #3a3228; white-space: nowrap;' },
      { text: 'NIHONGO GAKKO · SINCE 1987', style: cap + ' left: 24px; width: 342px; text-align: center; top: 470px; font-size: 10px;' }
    ];
    const scanning = mode === 'scan';
    const boxes = K.map((k) => {
      const ch = k[0];
      const isNew = !LEARNED[ch];
      const delay = Math.round(250 + ((k[2] - 170) / 340) * 1350);
      const color = isNew ? '#e8603f' : '#8db483';
      const bg = isNew ? 'rgba(232, 96, 63, 0.22)' : 'rgba(141, 180, 131, 0.22)';
      // With a fixed scanAt (static artboards) the state is drawn directly instead of animated.
      const anim = scanning ? (hasAt ? ' opacity: ' + (delay <= at ? 1 : 0) + ';' : ' animation: boxIn 0.35s ease-out both; animation-delay: ' + delay + 'ms;') : '';
      return {
        label: 'Kanji ' + ch + (isNew ? ', new to you' : ', already learned'),
        style: 'position: absolute; left: ' + (k[1] - 1) + 'px; top: ' + (k[2] - 3) + 'px; width: ' + (k[3] + 2) + 'px; height: ' + (k[3] + 6) + 'px; box-sizing: border-box; padding: 0; border-radius: 6px; border: 2px solid ' + color + '; background: ' + bg + '; box-shadow: 0 0 0 1px rgba(21, 19, 15, 0.35); cursor: pointer;' + anim,
        pick: () => { if (this.props.onPick) this.props.onPick(ch); }
      };
    });
    return {
      glyphs: glyphs,
      latin: latin,
      boxes: boxes,
      scanning: scanning,
      showBoxes: mode !== 'none' && !hide,
      photoStyle: 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; filter: blur(' + blur + 'px); transition: filter 0.35s ease;',
      boardStyle: 'position: absolute; top: 0; left: 0; width: 390px; height: 844px; transform-origin: 195px 340px; transform: rotate(' + tilt + 'deg); transition: transform 0.35s ease;',
      lineStyle: 'position: absolute; left: 24px; top: 170px; width: 342px; height: 3px; background: linear-gradient(90deg, transparent, #e8603f 12%, #e8603f 88%, transparent); box-shadow: 0 0 18px 6px rgba(232, 96, 63, 0.5); pointer-events: none;' + (hasAt ? ' transform: translateY(' + Math.round(340 * at / 1600) + 'px);' : ' animation: sweep 1600ms linear both;')
    };
  }
}
</script>
</body>
</html>
