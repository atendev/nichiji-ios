<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400&display=swap">
<style>
body{margin:0;background:var(--surface)}
.cv{position:relative;width:960px;height:300px;background:var(--surface);overflow:hidden}
.cv svg{position:absolute;left:0;top:0}
.b{rx:var(--radius-sm)}
.ink{fill:var(--ink)}.ver{fill:var(--vermilion)}.ind{fill:var(--indigo)}.hair{fill:var(--hairline)}
.glyph{fill:var(--vermilion-hover);font-family:var(--font-mincho);font-weight:500;font-size:360px}
.cut{stroke:var(--surface);stroke-width:2}
.tx{position:absolute;left:40px;bottom:32px;width:440px}
.tx h1{margin:0;font-family:var(--font-mincho);font-weight:500;font-size:104px;line-height:.95;color:var(--ink)}
.tx p{margin:var(--space-3) 0 0;font-family:var(--font-gothic);font-size:14px;color:var(--ink-muted)}
</style></head>
<body>
<div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: vermilion 240x220 (slab, bleeds top), ink 120x200, hairline 240x80, indigo 120x200 (bleeds right and bottom)
     arrangement: flush staggered modular grid, x from 480 to the right edge
     pattern: oversized 日 as a shape clipped by the vermilion slab (distinctive Mincho glyph, the app's own character), plus three cut-out rules
     scales: radius-sm corners, 24px steps -->
<defs><clipPath id="c"><rect x="600" y="0" width="240" height="220" rx="4"/></clipPath></defs>
<rect class="b ink" x="480" y="100" width="120" height="200"/>
<rect class="b ver" x="600" y="0" width="240" height="220"/>
<text class="glyph" x="720" y="300" text-anchor="middle" clip-path="url(#c)">日</text>
<rect class="b hair" x="600" y="220" width="240" height="80"/>
<rect class="b ind" x="840" y="100" width="120" height="200"/>
<path class="cut" d="M600 244H960M600 262H960M600 280H960"/>
</svg>
<div class="tx"><h1>Nichiji</h1><p>A kanji a day, kept in ink.</p></div>
</div>
</body></html>
