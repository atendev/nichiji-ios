<!-- @dsCard group="Progress" height=270 subtitle="Mark a kanji learned and watch the ring fill" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>ProgressRing</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"></head>
<body><div class="nj-stage"><div class="nj-row" id="rings"></div>
<div class="nj-row"><button class="nj-btn nj-btn--secondary" id="add">Learn one in N4</button></div>
</div>
<script>
var data=[{l:"N5",a:79,b:103},{l:"N4",a:112,b:167},{l:"N3",a:24,b:370}],R=40,C=2*Math.PI*R;
function draw(){document.getElementById("rings").innerHTML=data.map(function(d,i){return '<div class="nj-ring"><svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="'+d.l+': '+d.a+' of '+d.b+' learned"><circle class="track" cx="48" cy="48" r="'+R+'" fill="none" stroke-width="8"/><circle class="bar" id="bar'+i+'" cx="48" cy="48" r="'+R+'" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*d.a/d.b).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 48 48)"/><text class="num" id="num'+i+'" x="48" y="55" text-anchor="middle">'+d.a+'</text></svg><p class="caption"><b style="font-weight:500;color:var(--ink)">'+d.l+'</b><br><span id="cap'+i+'">'+d.a+' of '+d.b+' learned</span></p></div>'}).join("")}
draw();
document.getElementById("add").addEventListener("click",function(){var d=data[1];if(d.a<d.b)d.a++;document.getElementById("bar1").setAttribute("stroke-dasharray",(C*d.a/d.b).toFixed(1)+" "+C.toFixed(1));document.getElementById("num1").textContent=d.a;document.getElementById("cap1").textContent=d.a+" of "+d.b+" learned"});
</script></body></html>
