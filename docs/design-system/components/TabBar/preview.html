<!-- @dsCard group="Navigation" height=250 subtitle="Tap a tab to switch" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>TabBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"></head>
<body><div class="nj-stage"><p class="title nj-screen" id="scr" aria-live="polite">Today</p>
<nav class="nj-tabs" aria-label="Main">
<button class="nj-tab nj-tab--on" data-s="Today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><p class="caption">Today</p></button>
<button class="nj-tab" data-s="Dictionary"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg><p class="caption">Dictionary</p></button>
<button class="nj-tab" data-s="Review"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="14" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v11"/></svg><p class="caption">Review</p></button>
<button class="nj-tab" data-s="You"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-5 8-5s6.5 1 8 5"/></svg><p class="caption">You</p></button>
</nav>
</div>
<script>
var tabs=document.querySelectorAll(".nj-tab");
tabs.forEach(function(t){t.addEventListener("click",function(){tabs.forEach(function(x){x.classList.remove("nj-tab--on")});t.classList.add("nj-tab--on");document.getElementById("scr").textContent=t.dataset.s})});
</script></body></html>
