name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install tools
        run: brew install xcodegen swiftlint cocoapods
      - name: Lint
        run: make lint
      - name: Dataset generator tests
        run: make dataset-test
      - name: Test
        run: make test
        # xcodebuild passes TEST_RUNNER_ variables into the test process without the prefix.
        env:
          TEST_RUNNER_NICHIJI_SKIP_STOREKIT_TESTS: "1"
      # Podfile.lock is not committed yet; this prints the resolved pods so it can be.
      - name: Show resolved pods
        if: always()
        run: cat Podfile.lock || true

  unsigned-ipa:
    needs: build-test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen cocoapods
      - name: Build unsigned IPA
        run: make ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Nichiji-unsigned-ipa
          path: Nichiji.ipa
