name: CI

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed Internal build to TestFlight
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: make lint
      - name: Dataset generator tests
        run: make dataset-test
      - name: Test
        run: make test
        # xcodebuild passes TEST_RUNNER_ variables into the test process without the prefix.
        env:
          TEST_RUNNER_NICHIJI_SKIP_STOREKIT_TESTS: "1"

  testflight:
    needs: build-test
    if: inputs.testflight
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - name: Install signing certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
      - name: Install provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_WIDGET: ${{ secrets.PROFILE_WIDGET }}
        run: |
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            for profile in "$PROFILE_APP" "$PROFILE_WIDGET"; do
              printf '%s' "$profile" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
              uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
              cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
            done
          done
          rm "$RUNNER_TEMP/profile.mobileprovision"
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and upload to TestFlight
        run: make testflight
        # A re-run keeps its run number, so the attempt keeps each upload's build number unique.
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
