name: Photo lookup harness

on:
  workflow_dispatch:
  push:
    paths:
      - prototypes/photo-lookup/**
      - .github/workflows/photo-lookup-harness.yml

concurrency:
  group: photo-lookup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototypes/photo-lookup
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: |
          xcodegen generate
          xcodebuild archive -project PhotoLookup.xcodeproj -scheme PhotoLookup -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PhotoLookup.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/PhotoLookup.xcarchive/Products/Applications/PhotoLookup.app Payload/
          zip -qr PhotoLookup.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoLookup-unsigned-ipa
          path: prototypes/photo-lookup/PhotoLookup.ipa
