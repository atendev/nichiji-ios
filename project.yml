name: Nichiji
options:
  bundleIdPrefix: com.aten
  deploymentTarget:
    iOS: "27.0"
# Internal is a Release build with the dev unlock, for TestFlight.
# Internal and Release sign manually with the App Store profiles the signing wizard makes.
configs:
  Debug: debug
  Internal: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 68DPHWR5V5
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Internal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV_UNLOCK
targets:
  Nichiji:
    type: application
    platform: iOS
    # Folder references keep the generator's `kanji/` and `stroke-order/` layout in the bundle.
    sources:
      - Nichiji
      - path: Dataset/Shared/kanji-index.json
        buildPhase: resources
      - path: Dataset/Shared/DATA-SOURCES.md
        buildPhase: resources
      - path: Dataset/Shared/kanji
        type: folder
        buildPhase: resources
      - path: Dataset/AppOnly/words.json
        buildPhase: resources
      - path: Dataset/AppOnly/kanji-search.json
        buildPhase: resources
      - path: Dataset/AppOnly/stroke-order
        type: folder
        buildPhase: resources
      - path: Fonts
        includes: ["*.ttf"]
        buildPhase: resources
    dependencies:
      - target: NichijiWidget
    entitlements:
      path: Config/Nichiji.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aten.nichiji
    # Xcode merges the generated INFOPLIST_KEY_* values into this plist.
    info:
      path: Config/Nichiji-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts
          - ShipporiMincho-Regular.ttf
          - ZenKakuGothicNew-Regular.ttf
          - ZenKakuGothicNew-Medium.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.aten.nichiji
            CFBundleURLSchemes:
              - nichiji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aten.nichiji
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nichiji
        INFOPLIST_KEY_NSCameraUsageDescription: Nichiji uses the camera to take a photo and find the kanji in it. The photo is read on your device, and Nichiji sends it nowhere.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Nichiji adds a photo to your library only when you tap Save.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait only until a landscape layout exists. iPad multitasking needs every orientation, so it runs full screen.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
      configs:
        Internal:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Nichiji App Store
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Nichiji App Store
  NichijiWidget:
    type: app-extension
    platform: iOS
    # The extension compiles the shared model, service, token, and widget sources directly.
    sources:
      - NichijiWidget
      - Nichiji/Models
      - Nichiji/Services
      - Nichiji/Widget
      - Nichiji/DesignSystem/Tokens
      - path: Fonts
        includes: ["*.ttf"]
        buildPhase: resources
      - path: Dataset/Shared/kanji-index.json
        buildPhase: resources
      - path: Dataset/Shared/DATA-SOURCES.md
        buildPhase: resources
      - path: Dataset/Shared/kanji
        type: folder
        buildPhase: resources
    entitlements:
      path: Config/NichijiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aten.nichiji
    info:
      path: NichijiWidget/Info.plist
      properties:
        CFBundleDisplayName: Nichiji Widget
        # XcodeGen otherwise writes literal defaults, and App Store Connect wants the app's versions.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - ShipporiMincho-Regular.ttf
          - ZenKakuGothicNew-Regular.ttf
          - ZenKakuGothicNew-Medium.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aten.nichiji.widget
      configs:
        Internal:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Nichiji Widget App Store
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Nichiji Widget App Store
  NichijiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NichijiTests
      - path: Config/Nichiji.storekit
        buildPhase: resources
    dependencies:
      - target: Nichiji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aten.nichiji.tests
        GENERATE_INFOPLIST_FILE: YES
  NichijiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NichijiUITests]
    dependencies:
      - target: Nichiji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aten.nichiji.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nichiji:
    build:
      targets:
        Nichiji: all
        NichijiUITests: [test]
    # Local runs buy Pro against the StoreKit configuration instead of the App Store.
    run:
      config: Debug
      storeKitConfiguration: Config/Nichiji.storekit
    test:
      config: Debug
      targets:
        - NichijiTests
        - NichijiUITests
    archive:
      config: Release
